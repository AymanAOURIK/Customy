<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customy</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <div class="brand">
          <span class="eyebrow">Local resume tailor</span>
          <h1>Customy</h1>
        </div>
        <a class="nav-link" href="/dashboard">Dashboard →</a>
      </div>

      <div class="page-grid">
        <section class="card sticky-card">
          <span class="eyebrow">Input</span>
          <h2 class="serif">Paste a job description and generate the pack.</h2>
          <label class="field-label" for="jd-input">Job description</label>
          <textarea id="jd-input" rows="20" placeholder="Paste job description here..."></textarea>
          <label class="field-label" for="application-url-input">Application URL</label>
          <input
            id="application-url-input"
            class="text-input"
            type="url"
            placeholder="https://company.com/jobs/role"
          />

          <div class="toggle-list">
            <label class="toggle">
              <input type="checkbox" id="cover-letter-toggle" />
              <span>Cover letter</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="linkedin-toggle" />
              <span>LinkedIn message</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="email-toggle" />
              <span>Email draft</span>
            </label>
          </div>

          <button id="generate-btn" class="primary-button">Generate</button>
          <div id="status-banner" class="status-banner">Ready.</div>
        </section>

        <section class="card">
          <div class="output-header">
            <div>
              <span class="eyebrow">Output</span>
              <h2 class="serif">Preview</h2>
            </div>
          </div>

          <div id="analysis-grid" class="analysis-grid">
            <div class="info-chip">
              <span class="eyebrow">Company</span>
              <strong id="analysis-company">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Role</span>
              <strong id="analysis-role">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Language</span>
              <strong id="analysis-language">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Initial Score</span>
              <strong id="analysis-initial-score">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Updated Score</span>
              <strong id="analysis-updated-score">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Model</span>
              <strong id="analysis-model">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Prompt Tokens</span>
              <strong id="analysis-prompt-tokens">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Output Tokens</span>
              <strong id="analysis-output-tokens">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">Cached Tokens</span>
              <strong id="analysis-cached-tokens">-</strong>
            </div>
            <div class="info-chip">
              <span class="eyebrow">OpenAI Cost</span>
              <strong id="analysis-cost">-</strong>
            </div>
          </div>

          <div id="download-links" class="download-links"></div>
          <div id="tab-buttons" class="tab-buttons"></div>
          <div id="tab-panes"></div>
        </section>
      </div>
    </div>

    <script>
      const jdInput = document.getElementById("jd-input");
      const applicationUrlInput = document.getElementById("application-url-input");
      const generateBtn = document.getElementById("generate-btn");
      const statusBanner = document.getElementById("status-banner");
      const tabButtons = document.getElementById("tab-buttons");
      const tabPanes = document.getElementById("tab-panes");
      const downloadLinks = document.getElementById("download-links");

      function setStatus(message, mode = "") {
        statusBanner.textContent = message;
        statusBanner.className = `status-banner ${mode}`.trim();
      }

      function selectedOutputs() {
        const outputs = [];
        if (document.getElementById("cover-letter-toggle").checked) outputs.push("cover_letter");
        if (document.getElementById("linkedin-toggle").checked) outputs.push("linkedin_msg");
        if (document.getElementById("email-toggle").checked) outputs.push("email_draft");
        return outputs;
      }

      function formatNumber(value) {
        const numeric = Number(value || 0);
        return Number.isFinite(numeric) ? numeric.toLocaleString() : "-";
      }

      function formatUsd(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return "-";
        return `$${numeric.toFixed(numeric < 0.01 ? 6 : 4)}`;
      }

      function formatScore(value) {
        if (value === null || value === undefined || value === "") return "-";
        const numeric = Number(value);
        return Number.isFinite(numeric) ? numeric.toFixed(1) : "-";
      }

      function resumePreview(pack) {
        const isFrench = (pack.resume_language || "").toLowerCase() === "fr";
        const lines = [];
        lines.push(isFrench ? "RÉSUMÉ" : "SUMMARY");
        lines.push(pack.tailored_summary || "");
        lines.push("");
        lines.push(isFrench ? "COMPÉTENCES" : "SKILLS");
        ["languages", "frameworks", "tools"].forEach((key) => {
          const values = (pack.tailored_skills && pack.tailored_skills[key]) || [];
          lines.push(`${key.toUpperCase()}: ${values.join(", ")}`);
        });
        lines.push("");
        lines.push(isFrench ? "EXPÉRIENCE" : "EXPERIENCE");
        (pack.tailored_experiences || []).forEach((item) => {
          lines.push(`${item.role} | ${item.company} | ${item.start} - ${item.end}`);
          (item.bullets || []).forEach((bullet) => lines.push(`- ${bullet}`));
          lines.push("");
        });
        if ((pack.focus_areas || []).length) {
          lines.push(isFrench ? "AXES DE CIBLAGE" : "FOCUS AREAS");
          pack.focus_areas.forEach((item) => lines.push(`- ${item}`));
        }
        if ((pack.profile_update_hints || []).length) {
          lines.push("");
          lines.push(isFrench ? "PISTES POUR CANDIDATE.YAML" : "CANDIDATE.YAML REVIEW");
          pack.profile_update_hints.forEach((item) => lines.push(`- ${item}`));
        }
        return lines.join("\n").trim();
      }

      function copyText(text) {
        navigator.clipboard.writeText(text);
      }

      function renderTabs(data) {
        const tabs = [
          { id: "resume", label: "Resume", content: resumePreview(data.pack) },
        ];
        if (data.pack.cover_letter) tabs.push({ id: "cover_letter", label: "Cover Letter", content: data.pack.cover_letter });
        if (data.pack.linkedin_message) tabs.push({ id: "linkedin_message", label: "LinkedIn", content: data.pack.linkedin_message });
        if (data.pack.email_draft) tabs.push({ id: "email_draft", label: "Email", content: data.pack.email_draft });

        tabButtons.innerHTML = "";
        tabPanes.innerHTML = "";

        tabs.forEach((tab, index) => {
          const button = document.createElement("button");
          button.className = `tab-button ${index === 0 ? "active" : ""}`.trim();
          button.textContent = tab.label;
          button.dataset.target = tab.id;
          button.addEventListener("click", () => activateTab(tab.id));
          tabButtons.appendChild(button);

          const pane = document.createElement("div");
          pane.className = `output-pane ${index === 0 ? "active" : ""}`.trim();
          pane.id = `${tab.id}-pane`;

          const toolbar = document.createElement("div");
          toolbar.className = "pane-toolbar";
          const copyButton = document.createElement("button");
          copyButton.className = "copy-button";
          copyButton.textContent = "Copy";
          copyButton.addEventListener("click", () => copyText(tab.content));
          toolbar.appendChild(copyButton);

          const preview = document.createElement("pre");
          preview.className = "output-preview";
          preview.textContent = tab.content || "No content returned.";

          pane.appendChild(toolbar);
          pane.appendChild(preview);
          tabPanes.appendChild(pane);
        });
      }

      function activateTab(id) {
        document.querySelectorAll(".tab-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.target === id);
        });
        document.querySelectorAll(".output-pane").forEach((pane) => {
          pane.classList.toggle("active", pane.id === `${id}-pane`);
        });
      }

      function renderDownloads(files) {
        downloadLinks.innerHTML = "";
        Object.entries(files).forEach(([key, file]) => {
          if (!file.url) return;
          const filename = (file.path || file.url || "").split(/[\\/]/).pop();
          const link = document.createElement("a");
          link.className = "download-link";
          link.href = file.url;
          if (key === "cover_letter") {
            link.download = filename || "Ayman_Aourik_Cover_letter.txt";
          } else {
            link.target = "_blank";
            link.rel = "noreferrer";
          }
          link.textContent = key === "cover_letter" ? (filename || "cover_letter.txt") : key.replaceAll("_", " ");
          link.title = filename || key;
          downloadLinks.appendChild(link);
        });
      }

      function renderAnalysis(data) {
        const usage = data.usage || {};
        document.getElementById("analysis-company").textContent = data.company || "-";
        document.getElementById("analysis-role").textContent = data.role || "-";
        document.getElementById("analysis-language").textContent = data.analysis.language || "-";
        document.getElementById("analysis-initial-score").textContent = formatScore(data.initial_score);
        document.getElementById("analysis-updated-score").textContent = formatScore(data.updated_score);
        document.getElementById("analysis-model").textContent = usage.model_used || "-";
        document.getElementById("analysis-prompt-tokens").textContent = formatNumber(usage.prompt_tokens);
        document.getElementById("analysis-output-tokens").textContent = formatNumber(usage.completion_tokens);
        document.getElementById("analysis-cached-tokens").textContent = formatNumber(usage.cached_prompt_tokens);
        document.getElementById("analysis-cost").textContent = formatUsd(usage.total_cost_usd);
      }

      async function generate() {
        const jdText = jdInput.value.trim();
        if (!jdText) {
          setStatus("Paste a job description first.", "error");
          return;
        }

        generateBtn.disabled = true;
        setStatus("Generating tailored materials...", "loading");

        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jd: jdText,
              application_url: applicationUrlInput.value.trim(),
              outputs: selectedOutputs()
            })
          });
          const data = await res.json();
          if (data.error) {
            setStatus(data.error, "error");
            return;
          }
          renderAnalysis(data);
          renderDownloads(data.files);
          renderTabs(data);
          const costSuffix = data.usage && Number.isFinite(Number(data.usage.total_cost_usd))
            ? ` OpenAI cost ${formatUsd(data.usage.total_cost_usd)}.`
            : "";
          setStatus(`Saved under ${data.slug}.${costSuffix}`, "success");
        } catch (error) {
          setStatus(error.message || "Request failed.", "error");
        } finally {
          generateBtn.disabled = false;
        }
      }

      generateBtn.addEventListener("click", generate);
    </script>
  </body>
</html>
